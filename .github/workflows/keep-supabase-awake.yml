name: Garder le projet Supabase éveillé

# S'exécute toutes les 6h — largement sous la limite de 7 jours
# d'inactivité qui met le projet gratuit en pause. Peut aussi être
# lancé manuellement depuis l'onglet "Actions" de GitHub si besoin.
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -sf "${{ secrets.SUPABASE_URL }}/rest/v1/interventions?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}"
